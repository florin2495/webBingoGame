name: Unit tests

# Manual only (Actions tab > Run workflow, or `gh workflow run unit-tests.yml --ref main`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test
